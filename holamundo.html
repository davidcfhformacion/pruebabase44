<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo - Neón Vibrante</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --bg-dark: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background-orbs {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
        }

        .orb-1 {
            width: 380px; height: 380px;
            background: var(--neon-cyan);
            top: 5%; right: 10%;
            animation: drift1 18s infinite ease-in-out;
        }

        .orb-2 {
            width: 420px; height: 420px;
            background: var(--neon-magenta);
            bottom: 5%; left: 10%;
            animation: drift2 22s infinite ease-in-out;
        }

        @keyframes drift1 {
            0%   { transform: translate(0, 0) scale(1); }
            25%  { transform: translate(-120px, 80px) scale(1.3); }
            50%  { transform: translate(60px, 200px) scale(0.9); }
            75%  { transform: translate(-80px, -100px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes drift2 {
            0%   { transform: translate(0, 0) scale(1); }
            25%  { transform: translate(100px, -120px) scale(1.2); }
            50%  { transform: translate(-80px, -60px) scale(0.8); }
            75%  { transform: translate(150px, 100px) scale(1.4); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(20, 20, 20, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 4rem;
            text-align: center;
            box-shadow:
                0 0 30px rgba(0, 242, 255, 0.15),
                0 0 60px rgba(255, 0, 255, 0.1),
                0 25px 50px rgba(0, 0, 0, 0.7);
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
            min-width: 300px;
            background-image: linear-gradient(var(--bg-dark), var(--bg-dark)),
                              linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 1rem 0;
            filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.3));
            transform: translateZ(50px);
        }

        .subtitle {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            font-weight: 500;
            transform: translateZ(30px);
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: transparent;
            color: #ffffff;
            border: 2px solid transparent;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform: translateZ(20px);
            cursor: pointer;
            background-image: linear-gradient(var(--bg-dark), var(--bg-dark)),
                              linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2), 0 0 15px rgba(255, 0, 255, 0.15);
        }

        .btn:hover {
            box-shadow:
                0 0 25px rgba(0, 242, 255, 0.5),
                0 0 50px rgba(255, 0, 255, 0.35),
                inset 0 0 20px rgba(0, 242, 255, 0.15);
            transform: translateZ(20px) scale(1.05);
            color: var(--neon-cyan);
        }

        .btn:active {
            transform: translateZ(20px) scale(0.95);
        }
    </style>
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="glass-card" id="card">
        <h1 class="title">¡Hola, Mundo!</h1>
        <p class="subtitle">Solo HTML5 y CSS3</p>
        <button class="btn" onclick="celebrate()">¡Haz click aquí!</button>
    </div>

    <script>
        // Efecto 3D al mover el ratón (Parallax tilt)
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Vuelve a la posición original cuando el ratón sale
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Animación al hacer click en el botón
        function celebrate() {
            const btn = document.querySelector('.btn');
            const originalText = btn.textContent;

            btn.textContent = '✨ ¡Magia! ✨';
            btn.style.background = 'var(--neon-cyan)';
            btn.style.color = 'black';
            btn.style.borderColor = 'var(--neon-cyan)';

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = 'transparent';
                btn.style.color = '#ffffff';
                btn.style.borderColor = '';
            }, 2000);
        }
    </script>
</body>
</html>
