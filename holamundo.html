<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo - HTML Mágico</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff00ff;
            --bg: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background-orbs {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 300px; height: 300px;
            background: var(--primary);
            top: 10%; left: 20%;
        }
        
        .orb-2 {
            width: 400px; height: 400px;
            background: var(--secondary);
            bottom: 10%; right: 20%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.2); }
        }

        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 4rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: transform 0.2s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
            min-width: 300px;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 1rem 0;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
            transform: translateZ(50px);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            transform: translateZ(30px);
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform: translateZ(20px);
            cursor: pointer;
        }

        .btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transform: translateZ(20px) scale(1.05);
            color: var(--primary);
        }
        
        .btn:active {
            transform: translateZ(20px) scale(0.95);
        }
    </style>
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="glass-card" id="card">
        <h1 class="title">¡Hola, Mundo!</h1>
        <p class="subtitle">Solo HTML5 y CSS3</p>
        <button class="btn" onclick="celebrate()">¡Haz click aquí!</button>
    </div>

    <script>
        // Efecto 3D al mover el ratón (Parallax tilt)
        const card = document.getElementById('card');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Vuelve a la posición original cuando el ratón sale
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Animación al hacer click en el botón
        function celebrate() {
            const btn = document.querySelector('.btn');
            const originalText = btn.textContent;
            
            btn.textContent = '✨ ¡Magia! ✨';
            btn.style.background = 'var(--primary)';
            btn.style.color = 'black';
            btn.style.borderColor = 'var(--primary)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = 'transparent';
                btn.style.color = 'white';
                btn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }, 2000);
        }
    </script>
</body>
</html>
