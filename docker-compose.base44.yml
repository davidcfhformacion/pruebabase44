services:
  web:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["php", "-S", "0.0.0.0:3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "php", "-r", "echo @file_get_contents('http://127.0.0.1:3000/') !== false ? 'ok' : 'fail';"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
